[package]
name = "confect"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "CLI tool for managing system configuration files with Git"
license = "MIT"
repository = "https://github.com/ursul/confect"
homepage = "https://ursul.github.io/confect"
documentation = "https://ursul.github.io/confect"
readme = "README.md"
keywords = ["config", "git", "backup", "dotfiles", "sysadmin"]
categories = ["command-line-utilities", "config"]

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"
console = "0.16"

# Crypto
age = { version = "0.12", features = ["armor"] }
sha2 = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Filesystem
walkdir = "2.5"
glob = "0.3"
dirs = "7.0"
tempfile = "3.27"

# Unix
nix = { version = "0.31", features = ["user", "fs", "signal", "process"] }

# Processes
wait-timeout = "0.2"

# Diff
similar = "3.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utils
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
semver = "1.0"

# Self-update
ureq = "3.4"
flate2 = "1.1"
tar = "0.4.46"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
strip = true
