# cargo-release configuration
# https://github.com/crate-ci/cargo-release

# Don't publish to crates.io (yet)
publish = false

# Push to remote after release
push = true

# Create git tag
tag = true

# Tag name template
tag-name = "v{{version}}"

# Tag message
tag-message = "Release {{version}}"

# Commit message for version bump
pre-release-commit-message = "chore: release {{version}}"

# Run before release: the same gate as the release workflow
pre-release-hook = [
    "sh",
    "-c",
    "cargo fmt --all -- --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked",
]
